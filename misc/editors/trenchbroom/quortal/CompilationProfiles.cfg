{
    "profiles": [
        {
            "name": "quortal: bsp, vis and light",
            "workdir": "${MAP_DIR_PATH}",
            "tasks": [
                {
                    "type": "export",
                    "enabled": true,
                    "stripTbProperties": true,
                    "target": "${MAP_BASE_NAME}-compile.map"
                },
                {
                    "type": "tool",
                    "enabled": true,
                    "treatNonZeroResultCodeAsError": true,
                    "tool": "${q3map2}",
                    "parameters": "-fs_basepath \"${GAME_DIR_PATH}\" -fs_basegame quortal -bsp -meta -leaktest -custinfoparms \"${MAP_BASE_NAME}-compile.map\""
                },
                {
                    "type": "tool",
                    "enabled": true,
                    "treatNonZeroResultCodeAsError": true,
                    "tool": "${q3map2}",
                    "parameters": "-fs_basepath \"${GAME_DIR_PATH}\" -fs_basegame quortal -vis -saveprt \"${MAP_BASE_NAME}-compile.map\""
                },
                {
                    "type": "tool",
                    "enabled": true,
                    "treatNonZeroResultCodeAsError": true,
                    "tool": "${q3map2}",
                    "parameters": "-fs_basepath \"${GAME_DIR_PATH}\" -fs_basegame quortal -light -fast -samples 2 -custinfoparms \"${MAP_BASE_NAME}-compile.map\""
                },
                {
                    "type": "rename",
                    "enabled": true,
                    "source": "${MAP_BASE_NAME}-compile.bsp",
                    "target": "${MAP_BASE_NAME}.bsp"
                },
                {
                    "type": "rename",
                    "enabled": true,
                    "source": "${MAP_BASE_NAME}-compile.prt",
                    "target": "${MAP_BASE_NAME}.prt"
                },
                {
                    "type": "delete",
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}-compile.*"
                }
            ]
        }
    ],
    "version": 1
}
