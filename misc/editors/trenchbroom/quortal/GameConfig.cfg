{
    // quortal, for TrenchBroom. Copy this folder into TrenchBroom's games
    // folder, with quortal's entity definitions, entities.ent, beside this
    // file. Set the game path, in TrenchBroom's preferences, to the folder
    // that holds quortal and its game folder, such as build/Release in
    // quortal's source, and the path of q3map2 to NetRadiant-custom's, such
    // as the one quortal's build fetches into build/q3map2
    //
    // New maps are in the Valve 220 format, which keeps a texture's
    // alignment as its brush turns. Quake 3's own format is read too, as
    // quortal's test maps are written in it. The plug's shader is shown
    // see-through, as are caulk, clip, hint and trigger, which are never
    // drawn in the game
    "version": 9,
    "name": "quortal",
    "experimental": true,
    "fileformats": [
        { "format": "Quake3 (Valve)" },
        { "format": "Quake3 (legacy)" }
    ],
    "filesystem": {
        "searchpath": "quortal",
        "packageformat": { "extension": ".pk3", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [ ".tga", ".png", ".jpg", ".jpeg" ],
        "shaderSearchPath": "scripts"
    },
    "entities": {
        "definitions": [ "entities.ent" ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "scale": [ modelscale, modelscale_vec ]
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger_*",
                "material": "common/trigger"
            }
        ],
        "brushface": [
            {
                "name": "Plug",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "quortal/plug"
            },
            {
                "name": "Caulk",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/*caulk"
            },
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/*clip"
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/hint*"
            },
            {
                "name": "Detail",
                "match": "contentflag",
                "flags": [ "detail" ]
            }
        ]
    },
    "faceattribs": {
        // Textures are laid on at half scale, as in Quake 3
        "defaults": {
            "scale": [ 0.5, 0.5 ]
        },
        "surfaceflags": [],
        // Of a face's contents, only CONTENTS_DETAIL, 0x8000000, is offered
        "contentflags": [
            { "unused": true }, { "unused": true }, { "unused": true }, { "unused": true },
            { "unused": true }, { "unused": true }, { "unused": true }, { "unused": true },
            { "unused": true }, { "unused": true }, { "unused": true }, { "unused": true },
            { "unused": true }, { "unused": true }, { "unused": true }, { "unused": true },
            { "unused": true }, { "unused": true }, { "unused": true }, { "unused": true },
            { "unused": true }, { "unused": true }, { "unused": true }, { "unused": true },
            { "unused": true }, { "unused": true }, { "unused": true },
            { "name": "detail", "description": "Detail brush, which doesn't split the BSP" }
        ]
    },
    "compilationTools": [
        { "name": "q3map2", "description": "NetRadiant-custom's q3map2, which compiles the map" }
    ]
}
